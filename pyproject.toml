[project]
name = "korml"
dynamic = ["version"]
description = 'A korml Parser and Emitter'
readme = "readme.md"
license = "Apache-2.0"
authors = [
{ name = "Jayesh Badwaik", email = "j.badwaik@fz-juelich.de" },
]
dependencies = []

[project.urls]
Source = "https://gitlab.com/ambhora/software/korml"

[project.scripts]
korml = "korml.cli:main"

# ------------------------------------------------------------------------------
# Hatch configuration
# ------------------------------------------------------------------------------
[tool.hatch.version]
path = "src/korml/metadata.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/korml"]

[tool.hatch.build.targets.wheel.shared-data]
"share"="share"

# ------------------------------------------------------------------------------
# PyTest configuration
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src","test/lib"]
addopts = "--cov --cov-report term-missing --cov-fail-under=90 --cov-config=.coveragerc"

[tool.black]
line-length = 100

[tool.hatch.envs.tests]
dependencies = [
  "pytest>=6.3",
  "pytest-cov",
  "ruamel.yaml",
]

[tool.hatch.envs.tests.env-vars]
PYTHONPATH = "src:test/lib"

[tool.hatch.envs.tests.scripts]
testkorml-generate = "python -m testkorml.cli.generator {args}"


[tool.hatch.envs.mypy]
dependencies = [
  "types-PyYAML",
  "mypy",
  "semver",
  "pytest",
]

[tool.hatch.envs.docs]
dependencies = [
  "mkdocs-material",
  "mkdocstrings[python]",
  "mkdocs-awesome-nav",
  "mkdocs-add-number-plugin",
  "gitpython",
  "pyyaml",
  "pymdown-extensions",
  "mkdocs-gen-files",
  "mkdocs-awesome-pages-plugin",
  "mkdocs-macros-plugin",
  "mkdocs-pagetree-plugin",
  "mkdocs-git-authors-plugin",
  "mkdocs-git-revision-date-localized-plugin"
]


[tool.hatch.envs.format]
dependencies = [
  "black",
  "docformatter"
]


