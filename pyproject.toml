# ------------------------------------------------------------------------------
# SPDX-License-Identifier: Apache-2.0
# ------------------------------------------------------------------------------

[project]
name = "korml"
dynamic = ["version"]
description = 'A korml Parser and Emitter'
readme = "readme.md"
license = "Apache-2.0"
# match statements, X | None annotations and slotted dataclasses need 3.10;
# 3.11 is the oldest version the tests and CI run on.
requires-python = ">=3.11"
authors = [
{ name = "Jayesh Badwaik", email = "j.badwaik@fz-juelich.de" },
]
dependencies = []

[project.urls]
Source = "https://gitlab.com/ambhora/software/korml"

[project.scripts]
korml = "korml.cli:main"

# ------------------------------------------------------------------------------
# Hatch configuration
# ------------------------------------------------------------------------------
[tool.hatch.version]
path = "src/korml/metadata.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/korml"]

[tool.hatch.build.targets.wheel.shared-data]
"share"="share"

# ------------------------------------------------------------------------------
# PyTest configuration
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src","test/lib"]
addopts = "--cov --cov-report term-missing --cov-fail-under=90 --cov-config=.coveragerc"

# ------------------------------------------------------------------------------
# Development dependencies, installed by uv sync
# ------------------------------------------------------------------------------
[dependency-groups]
dev = [
  "pip-audit>=2.7",
  "pytest>=8",
  "pytest-cov>=6",
  "reuse>=5",
  "ruff>=0.15",
  # The test generators write YAML with ruamel.yaml; korml itself does not
  # use it.
  "ruamel.yaml>=0.18",
]
docs = [
  "cpdocs>=0.5.1",
  "mkdocs-materialx>=10.2",
  "properdocs>=1.6.7",
]

# ------------------------------------------------------------------------------
# Ruff configuration
# ------------------------------------------------------------------------------
# The 100 columns of the former Black configuration.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
