stages:
  - legal
  - check
  - test

default:
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_LINK_MODE: copy

.uv:
  before_script:
    - uv sync --locked
  cache:
    key:
      files: [uv.lock]
    paths: [.cache/uv]

# ------------------------------------------------------------------------------
# Legal
# ------------------------------------------------------------------------------

# Licence and copyright information of every file, checked before any other
# work.
reuse:
  extends: .uv
  stage: legal
  script:
    - uv run reuse lint

# ------------------------------------------------------------------------------
# Check
# ------------------------------------------------------------------------------

ruff:
  extends: .uv
  stage: check
  script:
    - uv run ruff check
    - uv run ruff format --check

# ------------------------------------------------------------------------------
# Test
# ------------------------------------------------------------------------------

unit-test:
  extends: .uv
  stage: test
  script:
    - uv run pytest -q --ignore=test/bin/test_fuzz_korml.py

fuzz-test:
  extends: .uv
  stage: test
  variables:
    KORML_FUZZ_CASES: "2000"
  script:
    - export KORML_FUZZ_SEED="${KORML_FUZZ_SEED:-$CI_PIPELINE_ID}"
    - echo "fuzz seed=$KORML_FUZZ_SEED cases=$KORML_FUZZ_CASES"
    - uv run pytest -q --no-cov test/bin/test_fuzz_korml.py
